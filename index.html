<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FiveM Clothing Viewer</title>
<style>
:root{--bg:#f3f4f6;--pn:#fff;--tx:#1f2430;--mu:#6b7280;--bd:#d7dae0;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--pn:#1d2128;--tx:#e6e8ec;--mu:#8b93a1;--bd:#2f3541;--ac:#5b9bff}}
:root[data-theme="dark"]{--bg:#14171c;--pn:#1d2128;--tx:#e6e8ec;--mu:#8b93a1;--bd:#2f3541;--ac:#5b9bff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,"Noto Sans Thai",sans-serif}
#app{display:flex;height:100%}
#side{width:270px;background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
h1{font-size:16px;margin:0}h2{font-size:12px;color:var(--mu);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em}
button,label.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;font:inherit;text-align:center}
.row{display:flex;gap:6px;flex-wrap:wrap}.row label{display:flex;gap:4px;align-items:center}
#log{font-size:12px;color:var(--mu);white-space:pre-wrap}
#list{max-height:230px;overflow:auto;border:1px solid var(--bd);border-radius:6px}#list div{padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:13px}#list div.on{background:var(--ac);color:#fff}
#tex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#tex div{border:2px solid var(--bd);border-radius:6px;cursor:pointer;padding:2px;font-size:10px;word-break:break-all;color:var(--mu)}
#tex div.on{border-color:var(--ac)}#tex canvas{width:100%;display:block;background:#888}
#view{flex:1;position:relative;min-width:0;background:linear-gradient(#5d7a99,#1b2430)}
#view canvas.gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:12px;top:10px;color:#ffd84d;font:12px monospace;pointer-events:none;white-space:pre}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-align:center;pointer-events:none;padding:20px}
@media(max-width:700px){#app{flex-direction:column-reverse}#side{width:auto;max-height:42%;border-right:0;border-top:1px solid var(--bd)}}
</style></head><body>
<div id="app">
 <div id="side">
  <h1>FiveM Clothing Viewer</h1>
  <div class="row"><label class="btn">เลือกไฟล์ / ZIP<input id="file" type="file" multiple accept=".ydd,.ytd,.zip,.rar,.7z" hidden></label><label class="btn">เลือกโฟลเดอร์<input id="dir" type="file" webkitdirectory hidden></label></div>
  <div class="row"><label><input type="checkbox" id="wf"> Wireframe</label><label><input type="checkbox" id="gr" checked> Grid</label><button id="rs">รีเซ็ตกล้อง</button><button id="clr" style="background:#dc2626">ล้างทั้งหมด</button></div>
  <h2>ชุดทั้งหมด <span id="cnt"></span></h2><input id="q" placeholder="ค้นหา..." style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)"><div id="list"></div><h2>Parts</h2><div id="parts" class="row" style="flex-direction:column"></div>
  <h2>Textures (.ytd)</h2><div id="tex"></div>
  <div id="log">ลากไฟล์มาวางได้ทั้งหน้า ไฟล์ไม่ถูกอัปโหลดออกจากเครื่อง</div>
 </div>
 <div id="view"><div id="hud"></div><div id="drop">ลากโฟลเดอร์ ไฟล์ ZIP หรือไฟล์ .ydd/.ytd มาวางที่นี่</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
const $=s=>document.querySelector(s),log=t=>$('#log').textContent=t;
// ---------- RSC7 ----------
function sizeFlags(f){const s=[(f>>>27&1),(f>>>26&1)<<1,(f>>>25&1)<<2,(f>>>24&1)<<3,(f>>>17&127)<<4,(f>>>11&63)<<5,(f>>>7&15)<<6,(f>>>5&3)<<7,(f>>>4&1)<<8];return (0x200<<(f&15))*s.reduce((a,b)=>a+b,0)}
async function load(buf){
 const d=new DataView(buf);
 if(d.getUint32(0,true)!==0x37435352)throw Error('ไม่ใช่ RSC7 (อาจเป็น Gen9 หรือถูกเข้ารหัส)');
 const sys=sizeFlags(d.getUint32(8,true));
 const st=new Blob([buf.slice(16)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
 const raw=await new Response(st).arrayBuffer(),dv=new DataView(raw);
 const u32=o=>dv.getUint32(o,true),u16=o=>dv.getUint16(o,true);
 const P=o=>{const p=u32(o),h=p>>>28;return h===5?p-0x50000000:h===6?sys+p-0x60000000:-1};
 return{dv,u32,u16,P,f32:o=>dv.getFloat32(o,true)};
}
const hf=h=>{const s=h>>15?-1:1,e=h>>10&31,f=h&1023;return e?e===31?0:s*2**(e-15)*(1+f/1024):s*5.96e-8*f};
// ---------- YDD ----------
function geom(r,g){
 const vb=r.P(g+0x18),ib=r.P(g+0x38);if(vb<0||ib<0)return null;
 const stride=r.u16(vb+8),vc=r.u32(vb+0x18),vd=r.P(vb+0x10),ic=r.u32(ib+8),id=r.P(ib+0x10);
 if(!stride||vd<0||id<0||!vc||!ic||vc>65535)return null;
 let flags=1;
 for(const c of[0x30,0x28,0x38]){const d=r.P(vb+c);if(d>0&&r.u16(d+4)===stride){flags=r.u32(d);break}}
 let off=[],o,ok=false;
 for(const t of[8,4]){o=0;off=[];[12,4,4,12,4,4,t,t,t,t,t,t,t,t,16,16].forEach((s,i)=>{if(flags>>i&1){off[i]=o;o+=s}});if(o===stride){ok=true;var tc=t;break}}
 off[0]=0;
 const pos=new Float32Array(vc*3),nor=ok&&off[3]!=null?new Float32Array(vc*3):null,uv=ok&&off[6]!=null?new Float32Array(vc*2):null;
 for(let i=0;i<vc;i++){const b=vd+i*stride;
  for(let k=0;k<3;k++)pos[i*3+k]=r.f32(b+k*4);
  if(nor)for(let k=0;k<3;k++)nor[i*3+k]=r.f32(b+off[3]+k*4);
  if(uv)for(let k=0;k<2;k++)uv[i*2+k]=tc===8?r.f32(b+off[6]+k*4):hf(r.u16(b+off[6]+k*2));}
 const idx=new Uint16Array(ic);let mx=0;
 for(let i=0;i<ic;i++){idx[i]=r.u16(id+i*2);if(idx[i]>mx)mx=idx[i]}
 if(mx>=vc)return null;
 const G=new THREE.BufferGeometry();
 G.setAttribute('position',new THREE.BufferAttribute(pos,3));
 if(uv)G.setAttribute('uv',new THREE.BufferAttribute(uv,2));
 G.setIndex(new THREE.BufferAttribute(idx,1));
 nor?G.setAttribute('normal',new THREE.BufferAttribute(nor,3)):G.computeVertexNormals();
 return G;
}
function parseYDD(r){
 const n=r.u16(0x38),arr=r.P(0x30),out=[];
 for(let i=0;i<n;i++){const d=r.P(arr+i*8);if(d<0)continue;
  for(const c of[0x50,0x58,0x60,0x68]){
   const l=r.P(d+c);if(l<0)continue;const la=r.P(l),lc=r.u16(l+8);
   if(la<0||!lc||lc>32)continue;
   for(let j=0;j<lc;j++){const m=r.P(la+j*8);if(m<0)continue;
    const ga=r.P(m+8),gc=r.u16(m+0x10);if(ga<0||gc>64)continue;
    for(let k=0;k<gc;k++){const g=r.P(ga+k*8);if(g<0)continue;const G=geom(r,g);if(G)out.push({G,name:'drawable '+i+' / geometry '+out.length})}}
   if(out.length)break;}
 }
 return out;
}
// ---------- YTD ----------
function dxt(r,off,w,h,type){
 const o=new Uint8ClampedArray(w*h*4),bw=Math.max(1,w>>2),bh=Math.max(1,h>>2);
 const c=v=>[(v>>11&31)*255/31,(v>>5&63)*255/63,(v&31)*255/31];
 for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
  const b=off+(by*bw+bx)*(type===1?8:16),cb=b+(type===1?0:8);
  const v0=r.u16(cb),v1=r.u16(cb+2),a=c(v0),z=c(v1),bits=r.u32(cb+4),p=[a,z];
  if(type===1&&v0<=v1){p.push(a.map((x,i)=>(x+z[i])/2),[0,0,0])}else{p.push(a.map((x,i)=>(2*x+z[i])/3),a.map((x,i)=>(x+2*z[i])/3))}
  let al=null;
  if(type===5){const a0=r.dv.getUint8(b),a1=r.dv.getUint8(b+1),t=[a0,a1];
   for(let i=1;i<7;i++)t.push(a0>a1?((7-i)*a0+i*a1)/7:i<5?((5-i)*a0+i*a1)/5:i===5?0:255);
   al=i=>{const bo=i*3,by_=b+2+(bo>>3),w16=r.dv.getUint8(by_)|(r.dv.getUint8(by_+1)<<8);return t[w16>>(bo&7)&7]}}
  for(let i=0;i<16;i++){
   const x=bx*4+(i&3),y=by*4+(i>>2);if(x>=w||y>=h)continue;
   const col=p[bits>>(i*2)&3],q=(y*w+x)*4;
   o[q]=col[0];o[q+1]=col[1];o[q+2]=col[2];
   o[q+3]=type===1?(v0<=v1&&(bits>>(i*2)&3)===3?0:255):type===3?(r.dv.getUint8(b+(i>>1))>>((i&1)*4)&15)*17:al(i);}
 }
 return o;
}
function parseYTD(r){
 const n=r.u16(0x38),arr=r.P(0x30),out=[];
 for(let i=0;i<n;i++){const t=r.P(arr+i*8);if(t<0)continue;
  const np=r.P(t+0x28);let name='texture_'+i;
  if(np>0){name='';for(let k=0;k<64&&r.dv.getUint8(np+k);k++)name+=String.fromCharCode(r.dv.getUint8(np+k))}
  const w=r.u16(t+0x50),h=r.u16(t+0x52),fmt=r.u32(t+0x58),dp=r.P(t+0x70);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  let px=null;
  if(dp>0&&w&&h){
   if(fmt===0x31545844)px=dxt(r,dp,w,h,1);else if(fmt===0x33545844)px=dxt(r,dp,w,h,3);else if(fmt===0x35545844)px=dxt(r,dp,w,h,5);
   else if(fmt===21){px=new Uint8ClampedArray(w*h*4);for(let k=0;k<w*h;k++){const b=dp+k*4;px[k*4]=r.dv.getUint8(b+2);px[k*4+1]=r.dv.getUint8(b+1);px[k*4+2]=r.dv.getUint8(b);px[k*4+3]=r.dv.getUint8(b+3)}}}
  if(px)cv.getContext('2d').putImageData(new ImageData(px,w,h),0,0);
  out.push({name:name+(px?'':' (ไม่รองรับฟอร์แมต)'),cv,ok:!!px});}
 return out;
}
// ---------- 3D ----------
const view=$('#view'),ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.domElement.className='gl';view.prepend(ren.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.01,100);
const BOOST=.95;const hl=new THREE.HemisphereLight(0xffffff,0x445566,.9*BOOST);scene.add(hl);const dl=new THREE.DirectionalLight(0xffffff,.8*BOOST);dl.position.set(2,3,4);scene.add(dl);const bl=new THREE.DirectionalLight(0xffffff,.5*BOOST);bl.position.set(-2,2,-4);scene.add(bl);
const grid=new THREE.GridHelper(4,20,0x999999,0x556070);scene.add(grid);
const root=new THREE.Group();root.rotation.x=-Math.PI/2;scene.add(root);
const mat=new THREE.MeshLambertMaterial({color:0xcccccc,side:THREE.DoubleSide,alphaTest:.1});
let th=0,ph=1.4,dist=2,tg=new THREE.Vector3(0,.5,0),meshes=[];
function upd(){cam.position.set(tg.x+dist*Math.sin(ph)*Math.sin(th),tg.y+dist*Math.cos(ph),tg.z+dist*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}
function frame(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3());tg=b.getCenter(new THREE.Vector3());dist=Math.max(s.x,s.y,s.z)*2.2;th=0;ph=1.4;grid.position.y=b.min.y;upd()}
function resize(){const w=view.clientWidth,h=view.clientHeight;ren.setSize(w,h,false);ren.setPixelRatio(devicePixelRatio);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view);upd();
(function loop(){requestAnimationFrame(loop);ren.render(scene,cam)})();
let drag=null;const cv=ren.domElement;
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointerup=()=>drag=null;
cv.onpointermove=e=>{if(!drag)return;th-=(e.clientX-drag[0])*.01;ph=Math.min(3,Math.max(.1,ph-(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];upd()};
cv.onwheel=e=>{e.preventDefault();dist*=e.deltaY>0?1.1:.9;upd()};
$('#wf').onchange=e=>mat.wireframe=e.target.checked;
$('#gr').onchange=e=>grid.visible=e.target.checked;
$('#rs').onclick=frame;
// ---------- UI ----------
let texs=[];
function hud(){let p=0,v=0;meshes.forEach(m=>{if(m.visible){p+=m.geometry.index.count/3;v+=m.geometry.attributes.position.count}});$('#hud').textContent='Polygons: '+p+'\nVertices: '+v}
function setTex(i){
 const t=texs[i];if(!t)return;
 if(mat.map)mat.map.dispose();
 if(t.ok){const tx=new THREE.CanvasTexture(t.cv);tx.flipY=false;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=8;mat.map=tx;mat.color.set(0xffffff)}else mat.map=null;
 mat.needsUpdate=true;[...$('#tex').children].forEach((d,k)=>d.classList.toggle('on',k===i));
}
function showTex(){
 const box=$('#tex');box.innerHTML='';
 texs.forEach((t,i)=>{const d=document.createElement('div');d.append(t.cv,t.name);d.onclick=()=>setTex(i);box.append(d)});
 const i=texs.findIndex(t=>t.ok&&/diff/i.test(t.name));setTex(i>=0?i:Math.max(0,texs.findIndex(t=>t.ok)));
}
function showParts(){
 const box=$('#parts');box.innerHTML='';
 meshes.forEach((m,i)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;
  c.onchange=()=>{m.visible=c.checked;hud()};l.append(c,m.userData.name);box.append(l)});
}
const lib={ydd:[],ytd:[]};let curM=null;
const keyOf=n=>{n=n.toLowerCase().replace(/\.[^.]+$/,'');const m=n.match(/^((?:.*\^)?)([a-z0-9_]+?)_(?:diff_)?(\d{2,3})(?:_|$)/);return m?m[1]+m[2]+'_'+(+m[3]):n};
function addE(e){e.key=keyOf(e.name);e.dir=e.path.replace(/[^/]*$/,'');const a=lib[e.ext];const k=a.findIndex(x=>x.path===e.path);k>=0?a[k]=e:a.push(e)}
function texFor(m){let a=lib.ytd.filter(t=>t.key===m.key&&t.dir===m.dir);if(!a.length)a=lib.ytd.filter(t=>t.key===m.key);if(!a.length&&lib.ydd.length===1)a=lib.ytd;return a}
function renderList(){
 const q=$('#q').value.toLowerCase(),box=$('#list');box.innerHTML='';
 [...lib.ydd].sort((a,b)=>a.path.localeCompare(b.path)).filter(m=>m.path.toLowerCase().includes(q)).forEach(m=>{
  const d=document.createElement('div');d._m=m;d.textContent=m.name.replace(/\.ydd$/i,'')+'  🎨'+texFor(m).length;d.title=m.path;d.onclick=()=>openModel(m);if(m===curM)d.className='on';box.append(d)});
 $('#cnt').textContent='('+lib.ydd.length+')';
}
async function openModel(m){
 curM=m;[...$('#list').children].forEach(d=>d.classList.toggle('on',d._m===m));log('กำลังโหลด '+m.name+' ...');
 try{
  const r=await load(await m.get());
  meshes.forEach(x=>{root.remove(x);x.geometry.dispose()});meshes=[];
  const gs=parseYDD(r);
  gs.forEach(g=>{const x=new THREE.Mesh(g.G,mat);x.userData.name=g.name;root.add(x);meshes.push(x)});
  showParts();hud();frame();
  texs=[];
  for(const t of texFor(m)){try{parseYTD(await load(await t.get())).forEach(x=>{x.name=t.name.replace(/\.ytd$/i,'')+(x.ok?'':' ✖');texs.push(x)})}catch(e){}}
  showTex();
  log(m.name+': '+gs.length+' geometry, '+texs.length+' texture'+(gs.length?'':'\nอ่านโมเดลไม่ได้ (อาจเป็น Gen9)'));
 }catch(e){log('✖ '+m.name+': '+e.message)}
}
async function addZip(f){
 const u8=new Uint8Array(await f.arrayBuffer()),names=[];
 fflate.unzipSync(u8,{filter:z=>{if(/\.(ydd|ytd)$/i.test(z.name))names.push(z.name);return false}});
 names.forEach(n=>addE({path:f.name+'/'+n,name:n.split('/').pop(),ext:n.split('.').pop().toLowerCase(),
  get:async()=>{const d=fflate.unzipSync(u8,{filter:z=>z.name===n})[n];return d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength)}}));
}
async function addArc(f){
 const B='https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/';
 const SZ=(await import(B+'7zz.es6.js')).default;
 const sz=await SZ({locateFile:n=>B+n});
 const FS=sz.FS;
 FS.writeFile('/in_archive',new Uint8Array(await f.arrayBuffer()));
 try{sz.callMain(['x','/in_archive','-o/out','-y'])}catch(e){}
 const files=[];
 const walkFS=d=>{for(const n of FS.readdir(d)){if(n==='.'||n==='..')continue;const p=d+'/'+n;FS.isDir(FS.stat(p).mode)?walkFS(p):files.push(p)}};
 try{walkFS('/out')}catch(e){throw Error('แตกไฟล์ไม่สำเร็จ')}
 files.forEach(p=>{const n=p.split('/').pop(),ext=n.split('.').pop().toLowerCase();if(ext!=='ydd'&&ext!=='ytd')return;
  const d=FS.readFile(p);addE({path:f.name+p.slice(4),name:n,ext,get:async()=>d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength)})});
}
$('#clr').onclick=()=>{lib.ydd=[];lib.ytd=[];curM=null;texs=[];meshes.forEach(x=>{root.remove(x);x.geometry.dispose()});meshes=[];if(mat.map){mat.map.dispose();mat.map=null;mat.needsUpdate=true}['#file','#dir'].forEach(s=>$(s).value='');$('#q').value='';$('#parts').innerHTML='';$('#tex').innerHTML='';$('#hud').textContent='';renderList();$('#drop').style.display='flex';log('ล้างแล้ว ลากไฟล์ใหม่มาวางได้เลย')};
async function ingest(items){
 $('#drop').style.display='none';const msgs=[];
 for(const it of items){
  const f=it.file,ext=f.name.split('.').pop().toLowerCase();
  if(ext==='ydd'||ext==='ytd')addE({path:it.path||f.name,name:f.name,ext,get:()=>f.arrayBuffer()});
  else if(ext==='zip'){try{await addZip(f)}catch(e){msgs.push('✖ '+f.name+': '+e.message)}}
  else if(ext==='rar'||ext==='7z'){log('กำลังแตกไฟล์ '+f.name+' ...');try{await Promise.race([addArc(f),new Promise((_,rj)=>setTimeout(()=>rj(Error('หมดเวลา 60 วินาที')),60000))])}catch(e){msgs.push('✖ '+f.name+': '+e.message+' (ลองแตกไฟล์เป็นโฟลเดอร์หรือ ZIP แทน)')}}
 }
 renderList();
 if(lib.ydd.length===1)openModel(lib.ydd[0]);
 else if(curM&&items.some(i=>/\.ytd$/i.test(i.file.name)))openModel(curM);
 msgs.push(lib.ydd.length+' โมเดล / '+lib.ytd.length+' texture');
 if(lib.ydd.length!==1||msgs.length>1)log(msgs.join('\n'));
}
async function walk(en,out){
 if(en.isFile){if(/\.(ydd|ytd|zip|rar|7z)$/i.test(en.name)){const f=await new Promise(r=>en.file(r));out.push({file:f,path:en.fullPath.replace(/^\//,'')})}}
 else{const rd=en.createReader();let all=[],b;do{b=await new Promise(r=>rd.readEntries(r));all.push(...b)}while(b.length);for(const c of all)await walk(c,out)}
}
$('#file').onchange=e=>ingest([...e.target.files].map(f=>({file:f})));
$('#dir').onchange=e=>ingest([...e.target.files].map(f=>({file:f,path:f.webkitRelativePath})));
$('#q').oninput=renderList;
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{
 e.preventDefault();
 const ens=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null),fl=[...e.dataTransfer.files];
 if(ens.some(Boolean)){const out=[];for(const en of ens)if(en)await walk(en,out);ingest(out)}
 else ingest(fl.map(f=>({file:f})));
});
</script></body></html>
